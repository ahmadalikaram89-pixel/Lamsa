<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  // Fast, optimistic auth check to avoid a flash of the app before
  // redirecting — this page previously had no auth guard at all. This local
  // check can't be trusted for anything security-relevant; the real check is
  // checkAuth() (calls /api/me against the actual server session) on
  // DOMContentLoaded further down.
  (function() {
    try {
      var user = JSON.parse(localStorage.getItem('lamsa_user') || 'null');
      if (!user || !user.loggedIn) window.location.replace('lamsa-auth.html');
    } catch (e) {
      window.location.replace('lamsa-auth.html');
    }
  })();
</script>
<title>Rearrange My Room | Lamsa</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<script src="js/icons.js"></script>
<style>
  .icon-svg { width: 1.15em; height: 1.15em; vertical-align: -0.18em; display: inline-block; flex-shrink: 0; }
  :root {
    --black: #f6f7f8;
    --dark: #edeff1;
    --card: #ffffff;
    --card-2: #fbfbfc;
    --border: #dfe2e6;
    --border-soft: rgba(107,116,128,0.24);
    --gold: #6b7480;
    --gold-light: #a3abb5;
    --gold-deep: #3d434b;
    --gold-dim: rgba(107,116,128,0.10);
    --white: #1b1e22;
    --gray: #767d86;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--black);
    color: var(--white);
    min-height: 100vh;
  }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--dark); }
  ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 2px; }

  /* shared metallic shine sweep */
  .shine-surface { position: relative; overflow: hidden; }
  .shine-surface::after {
    content: '';
    position: absolute; top: -80%; left: -40%;
    width: 24%; height: 260%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.95), transparent);
    transform: rotate(22deg);
    animation: shine-sweep 5.6s ease-in-out infinite;
    animation-delay: 1.8s;
    pointer-events: none;
  }
  @keyframes shine-sweep {
    0%, 25%  { left: -40%; }
    70%, 100% { left: 130%; }
  }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--white); }
  .logo-icon {
    width: 36px; height: 36px;
    border: 1.5px solid var(--gold);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .logo-text { font-size: 19px; font-weight: 900; letter-spacing: 1px; }
  .back-link {
    color: var(--gray);
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--gold); }
  .nav-right { display: flex; align-items: center; gap: 10px; }
  .nav-logout {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--gray);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px; font-weight: 700;
    font-family: 'Tajawal', sans-serif;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .nav-logout:hover { border-color: var(--gold); color: var(--gold); }

  .wrap { max-width: 560px; margin: 0 auto; padding: 100px 20px 60px; }
  .hero { max-width: 560px; margin: 0 auto; }
  h1 { font-size: clamp(26px, 6vw, 36px); font-weight: 900; text-align: center; margin-bottom: 10px; }
  .sub { color: var(--gray); font-size: 14px; text-align: center; line-height: 1.6; margin-bottom: 36px; }

  .module-card {
    background: var(--dark);
    border: 2px solid var(--gold);
    border-radius: 18px;
    padding: 26px 20px;
    box-shadow: 0 20px 50px rgba(107,116,128,0.15);
  }

  .module-header { text-align: center; margin-bottom: 20px; }
  .module-icon { font-size: 32px; margin-bottom: 8px; }
  .module-title { font-size: 19px; font-weight: 900; margin-bottom: 8px; }
  .module-desc { color: var(--gray); font-size: 12.5px; line-height: 1.5; }

  .sub-toggle { display: flex; gap: 8px; margin-bottom: 18px; }
  .sub-toggle-btn {
    flex: 1;
    background: var(--card);
    border: 1.5px solid var(--border);
    color: var(--gray);
    padding: 10px 6px;
    border-radius: 10px;
    font-family: 'Tajawal', sans-serif;
    font-size: 12px; font-weight: 900;
    cursor: pointer;
    transition: all 0.2s;
  }
  .sub-toggle-btn:hover { border-color: var(--gold); }
  .sub-toggle-btn.active { border-color: var(--gold); background: var(--gold-dim); color: var(--white); }

  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 14px;
    padding: 34px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .upload-zone:hover, .upload-zone.dragover { border-color: var(--gold); background: var(--gold-dim); }
  .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .upload-icon { font-size: 34px; margin-bottom: 10px; }
  .upload-title { font-size: 13.5px; font-weight: 700; margin-bottom: 6px; }
  .upload-sub { font-size: 11px; color: var(--gray); }

  .upload-preview { display: none; position: relative; }
  .upload-preview img { width: 100%; max-height: 260px; object-fit: cover; border-radius: 14px; display: block; }
  .upload-preview .remove-btn {
    position: absolute; top: 10px; right: 10px;
    background: rgba(0,0,0,0.7);
    border: 1px solid var(--border);
    color: white; border-radius: 6px;
    padding: 6px 12px; font-size: 12px;
    cursor: pointer;
  }

  .generate-btn {
    width: 100%;
    position: relative; overflow: hidden;
    background: linear-gradient(135deg, #eef0f2 0%, var(--gold-light) 16%, var(--gold) 42%, var(--gold-deep) 65%, var(--gold) 84%, #eef0f2 100%);
    color: var(--card);
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
    border: none;
    padding: 18px;
    border-radius: 12px;
    font-family: 'Tajawal', sans-serif;
    font-size: 15px; font-weight: 900;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 16px;
    box-shadow: 0 16px 34px -8px rgba(61,67,75,0.5), inset 0 1px 0 rgba(255,255,255,0.55);
  }
  .generate-btn::after {
    content: '';
    position: absolute; top: -80%; left: -40%;
    width: 20%; height: 260%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.95), transparent);
    transform: rotate(22deg);
    animation: shine-sweep 5.6s ease-in-out infinite;
    animation-delay: 1.8s;
    pointer-events: none;
  }
  .generate-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 20px 44px -6px rgba(107,116,128,0.55); }
  .generate-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .generate-btn:disabled::after { animation: none; display: none; }

  .result-area { display: none; max-width: 560px; margin: 32px auto 0; }
  .result-area.show { display: block; animation: fadeUp 0.5s ease both; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  .result-img-wrap {
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    aspect-ratio: 16/9;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .result-placeholder { text-align: center; color: var(--gray); padding: 20px; }
  .result-placeholder .rp-icon { font-size: 48px; margin-bottom: 12px; }
  .result-placeholder p { font-size: 14px; }
  .result-placeholder small { font-size: 11px; color: #444; }
  .loading-dots { display: none; justify-content: center; gap: 8px; margin-top: 16px; }
  .loading-dots.show { display: flex; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation: bounce 1.4s infinite ease-in-out both; }
  .dot:nth-child(1) { animation-delay: -0.32s; }
  .dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; } }

  /* NEARBY STORES */
  .nearby-stores { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
  .nearby-stores-title { font-size: 15px; font-weight: 900; margin-bottom: 4px; }
  .nearby-stores-sub { font-size: 12px; color: var(--gray); margin-bottom: 14px; }
  .nearby-stores-list { display: flex; flex-direction: column; gap: 10px; }
  .nearby-store-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px;
  }
  .nearby-store-name { font-size: 13.5px; font-weight: 700; }
  .nearby-store-btn {
    flex-shrink: 0;
    background: transparent; border: 1.5px solid var(--gold); color: var(--gold);
    font-family: 'Tajawal', sans-serif; font-size: 11.5px; font-weight: 700;
    padding: 7px 12px; border-radius: 20px; text-decoration: none;
    white-space: nowrap; transition: all 0.2s;
  }
  .nearby-store-btn:hover { background: var(--gold-dim); }
</style>
</head>

  <div class="hero">
    <h1><svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 3l1.4 4 4 1.4-4 1.4L12 14l-1.4-4.2-4-1.4 4-1.4L12 3z" fill="currentColor" stroke="none"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z" fill="currentColor" stroke="none"/></svg> Rearrange My Room</h1>
    <p class="sub">Upload a photo of your room and let AI find the best new layout.</p>
  </div>

  <div class="module-card">
    <div class="module-header">
      <div class="module-icon"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="9" width="14" height="10" rx="2.5"/><path d="M12 9V5"/><circle cx="12" cy="3.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="9" cy="14" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="14" r="1.2" fill="currentColor" stroke="none"/><path d="M2 13h3M19 13h3"/></svg></div>

    </button>
    <div id="creditsBadge" style="text-align:center;margin-top:10px;font-size:12px;color:var(--gold);"></div>
  </div>

  <div class="result-area" id="resultArea">
    <div class="result-img-wrap" id="resultImg">
      <div class="result-placeholder" id="resultPlaceholder">
        <div class="rp-icon"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5c-4.9 0-8.5 3.7-8.5 8.2 0 3.8 2.8 5.8 5.2 5.8.9 0 1.1-.5.6-1.2-.6-.9.1-1.6 1.1-1.6h2c3 0 6.1-2 6.1-6C18.5 5.8 15.6 3.5 12 3.5z"/><circle cx="8.3" cy="10.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="8" r="1.1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="10.3" r="1.1" fill="currentColor" stroke="none"/></svg></div>
        <p>Generating your new layout...</p>
        <small>Takes 15-30 seconds</small>
      </div>
    </div>
    <div class="loading-dots" id="loadingDots">
      <div class="dot"></div>

    <div id="nearbyStoresContainer"></div>

<script src="js/nearby-stores.js"></script>
<script>
  var REARRANGE_PROMPT =
    'CRITICAL: Do NOT add any new furniture. Do NOT change any existing furniture.\n' +
    'Use ONLY what is visible in the original photo.\n' +
    'The same sofa, same bed, same chairs, same items — just moved to new positions.\n\n' +
    'You are an expert interior designer tasked with DRAMATICALLY rearranging this room.\n\n' +
    'MANDATORY CHANGES - every single piece must move:\n' +
    '- The sofa/largest seating: move to completely opposite wall or perpendicular position\n' +
    '- The bed: move headboard to a different wall entirely\n' +
    '- Coffee table: reposition to center of new seating arrangement\n' +
    '- All chairs: rotate and reposition to face new focal point\n' +
    '- Wardrobe/tall pieces: slide to different wall\n' +
    '- TV unit: only move if space allows\n\n' +
    'DESIGN PRINCIPLES to apply:\n' +
    '- Identify the room focal point (TV, window, fireplace)\n' +
    '- All seating must face the focal point\n' +
    '- Create 60-90cm clear walkways\n' +
    '- No furniture blocking doors or windows\n' +
    '- Balance visual weight left and right\n' +
    '- Create intimate conversation groupings\n\n' +
    'The before and after must look COMPLETELY DIFFERENT in furniture layout.\n' +
    'Furniture appearance stays 100% identical - same color, material, size.\n' +
    'Output: photorealistic, professional interior design result.';

  var FULL_REDESIGN_PROMPT =
    'CRITICAL: This must be a DRAMATIC, COMPLETE visual transformation of the room — not a minor touch-up. ' +
    'If someone compares the before and after side by side, almost nothing about the decor should look the same.\n\n' +
    'You are an expert interior designer tasked with a full redesign of this room.\n\n' +
    'MANDATORY CHANGES - every one of these must be clearly, visibly different from the original photo:\n' +
    '- Wall color/finish: change to a new palette, different from the original\n' +
    '- Flooring: change the material, color, or finish\n' +
    '- Every furniture piece (sofas, chairs, tables, storage, bed): REPLACE with different pieces — different shape, material, and color than what is in the photo\n' +
    '- Lighting fixtures: replace with new fixtures\n' +
    '- Decor and accessories (art, rugs, plants, curtains, cushions): replace entirely with new items\n' +
    '- Furniture layout: rearrange into a new configuration, not the same positions as the original\n\n' +
    'DESIGN PRINCIPLES to apply:\n' +
    '- Identify the room focal point (TV, window, fireplace) and design around it\n' +
    '- All seating must face the focal point\n' +
    '- Create 60-90cm clear walkways\n' +
    '- No furniture blocking doors or windows\n' +
    '- Balance visual weight left and right\n' +
    '- Create intimate conversation groupings\n\n' +
    'STRICTLY PRESERVE ONLY: room shape, wall count, ceiling height, number and position of windows and doors, room proportions, and camera angle — everything else (colors, materials, furniture, decor, lighting) must change.\n' +
    'DO NOT add, move, or remove architectural elements (windows, doors, walls, structural beams).\n\n' +
    'The before and after must look like a completely different room in style, color, and furniture — only the architecture stays recognizable.\n' +
    'Output: photorealistic, professional interior design magazine quality result.';

  var state = { uploadedFile: null, uploadedImageUrl: null, subMode: 'rearrange' };

  function selectSubMode(subMode) {
    state.subMode = subMode;
    console.log('[auto] sub-mode switched to:', subMode);

    var buttons = document.querySelectorAll('#subToggle .sub-toggle-btn');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle('active', buttons[i].getAttribute('data-submode') === subMode);
    }
  }

  function handleUpload(input) {
    var file = input.files[0];
    if (!file) return;
    setUploadedFile(file);
  }

  function setUploadedFile(file) {
    state.uploadedFile = file;
    state.uploadedImageUrl = null;
    console.log('[upload] new photo selected:', file.name, file.size + ' bytes');

    document.getElementById('previewImg').src = URL.createObjectURL(file);
    document.getElementById('uploadContent').style.display = 'none';
    document.getElementById('uploadPreview').style.display = 'block';
    document.getElementById('generateBtn').disabled = false;
  }

  function removeImage(e) {
    e.preventDefault();
    e.stopPropagation();
    state.uploadedFile = null;
    state.uploadedImageUrl = null;

    document.getElementById('fileInput').value = '';
    document.getElementById('uploadContent').style.display = 'block';
    document.getElementById('uploadPreview').style.display = 'none';
    document.getElementById('generateBtn').disabled = true;
  }

  window.addEventListener('DOMContentLoaded', function() {
    setupDropZone();
  });

  function setupDropZone() {
    var zone = document.getElementById('uploadZone');
    zone.addEventListener('dragover', function(e) { e.preventDefault(); e.stopPropagation(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave', function(e) { e.preventDefault(); e.stopPropagation(); zone.classList.remove('dragover'); });
    zone.addEventListener('drop', function(e) {
      e.preventDefault(); e.stopPropagation();
      zone.classList.remove('dragover');
      var file = e.dataTransfer.files[0];
      if (!file || !file.type.startsWith('image/')) return;
      setUploadedFile(file);
    });
  }

  function compressImage(file, maxSize, quality, callback) {
    var img = new Image();
    var objUrl = URL.createObjectURL(file);
    img.onload = function() {
      URL.revokeObjectURL(objUrl);
      var w = img.width, h = img.height;
      if (w > maxSize || h > maxSize) {
        if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
        else { w = Math.round(w * maxSize / h); h = maxSize; }
      }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = function() {
      URL.revokeObjectURL(objUrl);
      var fr = new FileReader();
      fr.onload = function(e) { callback(e.target.result); };
      fr.readAsDataURL(file);
    };
    img.src = objUrl;
  }

  function showError(msg) {
    document.getElementById('loadingDots').classList.remove('show');
    var ph = document.getElementById('resultPlaceholder');
    ph.style.display = 'block';
    ph.innerHTML = '<div class="rp-icon"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg></div><p>' + msg + '</p>';
    document.getElementById('generateBtn').disabled = !state.uploadedFile;
  }

  function createDownloadBtn(url, filename) {
    var wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;gap:10px;margin:10px 0;';

    var saveBtn = document.createElement('button');
    saveBtn.style.cssText = 'flex:1;background:var(--gold);color:var(--black);border:none;' +
      'padding:14px;border-radius:10px;font-weight:900;font-size:14px;cursor:pointer;' +
      'font-family:Tajawal,sans-serif;transition:all 0.2s;';
    saveBtn.innerHTML = (window.icon ? window.icon('download') : '') + ' Save Image';
    saveBtn.onclick = function() {
      var link = document.createElement('a');
      link.href = url; // the direct fal.ai image URL
      link.download = filename;
      link.target = '_blank';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    var shareBtn = document.createElement('button');
    shareBtn.style.cssText = 'background:transparent;color:var(--gold);border:1.5px solid var(--gold);' +
      'padding:14px 18px;border-radius:10px;font-weight:900;font-size:14px;cursor:pointer;' +
      'font-family:Tajawal,sans-serif;transition:all 0.2s;white-space:nowrap;';
    shareBtn.innerHTML = (window.icon ? window.icon('share') : '') + ' Share';
    shareBtn.onclick = function() {
      if (navigator.share) navigator.share({ title: 'Lamsa Rearranged Room', url: url }).catch(function() { window.open(url, '_blank'); });
      else window.open(url, '_blank');
    };

    wrap.appendChild(saveBtn);
    wrap.appendChild(shareBtn);
    return wrap;
  }

  var POLL_INTERVAL_MS = 3000; // poll every 3 seconds
  var POLL_TIMEOUT_MS = 2 * 60 * 1000; // 2 minutes

  // fal.ai's queue result payload shape varies by endpoint/version — sometimes the
  // images are top-level, sometimes nested under output/response/data. Check every
  // known shape instead of assuming just `data.images`.
  function extractResultImages(data) {
    if (!data) return null;
    if (Array.isArray(data.images) && data.images.length) return data.images;
    if (data.image && data.image.url) return [data.image];
    if (data.output && Array.isArray(data.output.images) && data.output.images.length) return data.output.images;
    if (data.response && Array.isArray(data.response.images) && data.response.images.length) return data.response.images;
    if (data.data && Array.isArray(data.data.images) && data.data.images.length) return data.data.images;
    return null;
  }

  function renderGenerateResult(data) {
    console.log('[generate] rendering result:', data);
    document.getElementById('loadingDots').classList.remove('show');
    document.getElementById('generateBtn').disabled = !state.uploadedFile;

    var images = extractResultImages(data);

    if (images && images.length > 0) {
      console.log('[generate] displaying image:', images[0].url);
      document.getElementById('resultPlaceholder').style.display = 'none';
      var imgWrap = document.getElementById('resultImg');
      imgWrap.innerHTML = '';
      var imgEl = document.createElement('img');
      imgEl.src = images[0].url;
      imgEl.style.cssText = 'width:100%;border-radius:10px;';
      imgWrap.style.cssText = 'display:block;aspect-ratio:auto;';
      imgWrap.appendChild(imgEl);
      imgWrap.appendChild(createDownloadBtn(images[0].url, 'lamsa-rearranged.jpg'));

      if (window.NearbyStores) {
        NearbyStores.render('nearbyStoresContainer', {
          countryCode: NearbyStores.countryFromLocale(),
          lang: 'en'
        });
      } else {
        console.error('[nearby-stores] window.NearbyStores is undefined — js/nearby-stores.js failed to load');
      }
      refreshCreditBalance(); // a credit was just spent — reflect the new balance
    } else {
      console.error('[generate] no images in result data:', data);
      showError('Error generating image. Please try again.');
    }
  }

  function fetchJson(url) {
    return fetch(url).then(function(res) {
      return res.json().then(function(data) {
        return { ok: res.ok, status: res.status, data: data };
      });
    });
  }

  function pollForResult(requestId, startTime) {
    var elapsed = Date.now() - startTime;
    if (elapsed >= POLL_TIMEOUT_MS) {
      console.error('[generate] polling timed out after ' + Math.round(elapsed / 1000) + 's for request_id:', requestId);
      showError('Generation took too long. Please try again.');
      return;
    }

    console.log('[generate] polling status for request_id:', requestId, '(elapsed ' + Math.round(elapsed / 1000) + 's)');

    fetchJson('/api/status?request_id=' + encodeURIComponent(requestId))
      .then(function(result) {
        console.log('[generate] status response (http ' + result.status + '):', result.data);

        if (!result.ok) {
          console.error('[generate] status check returned an error:', result.data);
          showError('Error generating image. Please try again.');
          return;
        }

        // fal.ai returns status in varying casing depending on the endpoint version,
        // so normalize before comparing.
        var status = (result.data.status || '').toString().toUpperCase();

        if (status === 'COMPLETED') {
          console.log('[generate] status COMPLETED — fetching final result for request_id:', requestId);
          fetchJson('/api/status?request_id=' + encodeURIComponent(requestId) + '&mode=result')
            .then(function(resultResp) {
              console.log('[generate] result response (http ' + resultResp.status + '):', resultResp.data);
              if (!resultResp.ok) {
                console.error('[generate] result fetch returned an error:', resultResp.data);
                showError('Error generating image. Please try again.');
                return;
              }
              renderGenerateResult(resultResp.data);
            })
            .catch(function(err) {
              console.error('[generate] result fetch threw:', err);
              showError('Connection error. Please try again.');
            });
        } else if (status === 'FAILED' || status === 'ERROR') {
          console.error('[generate] generation failed:', result.data);
          showError('Error generating image. Please try again.');
        } else {
          console.log('[generate] status = ' + status + ' — polling again in ' + (POLL_INTERVAL_MS / 1000) + 's');
          setTimeout(function() { pollForResult(requestId, startTime); }, POLL_INTERVAL_MS);
        }
      })
      .catch(function(err) {
        console.error('[generate] status check threw:', err);
        showError('Connection error. Please try again.');
      });
  }

  function callGenerate(imageUrl, prompt, guidanceScale, strength) {
    var requestBody = {
      prompt: prompt,
      image_url: imageUrl,
      num_images: 1,
      guidance_scale: guidanceScale || 3.5,
      aspect_ratio: '16:9'
    };
    // fal.ai's `strength` (0-1) caps how much the output may differ from the
    // source photo — separate from guidance_scale (prompt weight) — and
    // defaults to 0.1 (a light touch-up) when omitted.
    if (imageUrl && typeof strength === 'number') requestBody.strength = strength;
    console.log('[generate] POST /api/generate:', requestBody);

    fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(requestBody)
    })
    .then(function(res) {
      return res.json().then(function(data) { return { ok: res.ok, status: res.status, data: data }; });
    })
    .then(function(result) {
      console.log('[generate] /api/generate response (http ' + result.status + '):', result.data);

      if (result.status === 401) {
        console.log('[generate] session expired, redirecting to login');
        window.location.replace('lamsa-auth.html');
        return;
      }

      if (result.status === 402) {
        console.log('[generate] blocked - no credits remaining');
        document.getElementById('loadingDots').classList.remove('show');
        document.getElementById('resultArea').classList.remove('show');
        showCreditsModal("You're out of credits — buy more to continue");
        refreshCreditBalance();
        return;
      }

      if (!result.ok || !result.data || !result.data.request_id) {
        console.error('[generate] no request_id in response:', result.data);
        showError('Error generating image. Please try again.');
        return;
      }

      console.log('[generate] request_id received:', result.data.request_id, '— starting poll loop');
      pollForResult(result.data.request_id, Date.now());
    })
    .catch(function(err) {
      console.error('[generate] /api/generate call threw:', err);
      showError('Connection error. Please try again.');
    });
  }

  // Compresses + uploads the photo once, then caches and reuses the hosted URL
  // for the generate call so we never re-upload the same photo twice.
  function ensurePhotoUploaded(callback) {
    if (state.uploadedImageUrl) {
      console.log('[upload] reusing already-uploaded photo url:', state.uploadedImageUrl);
      callback(state.uploadedImageUrl);
      return;
    }

    console.log('[upload] compressing image:', state.uploadedFile.name, state.uploadedFile.size + ' bytes');
    compressImage(state.uploadedFile, 1536, 0.9, function(imageDataUrl) {
      console.log('[upload] image compressed, uploading to /api/upload');
      fetch('/api/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image_data: imageDataUrl, mime_type: state.uploadedFile.type || 'image/jpeg' })
      })
      .then(function(res) {
        return res.json().then(function(data) { return { ok: res.ok, status: res.status, data: data }; });
      })
      .then(function(result) {
        console.log('[upload] /api/upload response (http ' + result.status + '):', result.data);
        if (!result.ok || !result.data || !result.data.url) {
          console.error('[upload] upload did not return a usable url, falling back to inline data url');
        }
        state.uploadedImageUrl = (result.ok && result.data && result.data.url) ? result.data.url : imageDataUrl;
        callback(state.uploadedImageUrl);
      })
      .catch(function(err) {
        console.error('[upload] upload call threw:', err);
        showError('Image upload failed. Please try again.');
      });
    });
  }

  // A prior successful renderGenerateResult() replaces #resultImg's contents
  // with the result image, which removes #resultPlaceholder from the DOM.
  // Recreate it before every run so a second/third generate doesn't crash.
  function ensureResultPlaceholder() {
    if (document.getElementById('resultPlaceholder')) return;
    document.getElementById('resultImg').innerHTML =
      '<div class="result-placeholder" id="resultPlaceholder">' +
        '<div class="rp-icon"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5c-4.9 0-8.5 3.7-8.5 8.2 0 3.8 2.8 5.8 5.2 5.8.9 0 1.1-.5.6-1.2-.6-.9.1-1.6 1.1-1.6h2c3 0 6.1-2 6.1-6C18.5 5.8 15.6 3.5 12 3.5z"/><circle cx="8.3" cy="10.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="8" r="1.1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="10.3" r="1.1" fill="currentColor" stroke="none"/></svg></div>' +
        '<p>Generating your new layout...</p>' +
        '<small>Takes 15-30 seconds</small>' +
      '</div>';
  }

  function showResultLoading() {
    var resultArea = document.getElementById('resultArea');
    resultArea.classList.add('show');
    resultArea.scrollIntoView({ behavior: 'smooth', block: 'center' });

    ensureResultPlaceholder();

    var ph = document.getElementById('resultPlaceholder');
    ph.style.display = 'block';
    ph.innerHTML = '<div class="rp-icon"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5c-4.9 0-8.5 3.7-8.5 8.2 0 3.8 2.8 5.8 5.2 5.8.9 0 1.1-.5.6-1.2-.6-.9.1-1.6 1.1-1.6h2c3 0 6.1-2 6.1-6C18.5 5.8 15.6 3.5 12 3.5z"/><circle cx="8.3" cy="10.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="8" r="1.1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="10.3" r="1.1" fill="currentColor" stroke="none"/></svg></div><p>Generating your new layout...</p><small>Takes 15-30 seconds</small>';
    document.getElementById('loadingDots').classList.add('show');
  }

  // ===== AUTH (real server session) + CREDITS / PAYMENTS =====
  var CREDIT_PACKAGES = [
    { id: 'x1',  credits: 1,  price: '€1', label: '1 Design' },
    { id: 'x5',  credits: 5,  price: '€4', label: '5 Designs' },
    { id: 'x10', credits: 10, price: '€7', label: '10 Designs' }
  ];

  var currentUser = null;

  // The server session cookie is what actually gates generate()/credits/
  // checkout — this call enforces that, redirecting to login if the session
  // is missing or expired. The localStorage flag checked at the top of
  // <head> is just a fast optimistic check, not a security boundary.
  function checkAuth() {
    return fetch('/api/me', { credentials: 'include' })
      .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, data: data }; }); })
      .then(function(result) {
        if (!result.ok) {
          window.location.replace('lamsa-auth.html');
          return null;
        }
        currentUser = result.data;
        try { localStorage.setItem('lamsa_user', JSON.stringify({ username: currentUser.username, email: currentUser.email, loggedIn: true })); } catch (e) {}
        return currentUser;
      })
      .catch(function(err) {
        console.error('[auth] session check failed:', err);
        window.location.replace('lamsa-auth.html');
        return null;
      });
  }

  function logout() {
    fetch('/api/auth-logout', { method: 'POST', credentials: 'include' })
      .catch(function(err) { console.error('[auth] logout request failed:', err); })
      .then(function() {
        try { localStorage.removeItem('lamsa_user'); } catch (e) {}
        window.location.replace('lamsa-auth.html');
      });
  }

  function refreshCreditBalance() {
    var badge = document.getElementById('creditsBadge');
    if (!badge) return;

    fetch('/api/credits', { credentials: 'include' })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (typeof data.credits !== 'number') return;
        badge.innerHTML = 'Your balance: <b>' + data.credits + '</b> credit' + (data.credits === 1 ? '' : 's') +
          ' &middot; <a href="javascript:void(0)" onclick="showCreditsModal()" style="color:var(--gold);text-decoration:underline;">Buy more</a>';
      })
      .catch(function(err) { console.error('[credits] failed to load balance:', err); });
  }

  function showCreditsModal(message) {
    var existing = document.getElementById('creditsModalOverlay');
    if (existing) existing.remove();

    var overlay = document.createElement('div');
    overlay.id = 'creditsModalOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;';

    var box = document.createElement('div');
    box.style.cssText = 'background:var(--dark);border:1px solid var(--gold);border-radius:20px;padding:32px 24px;max-width:420px;width:100%;text-align:center;';

    var sub = message || 'Each design uses 1 credit from your balance';

    var packagesHtml = CREDIT_PACKAGES.map(function(pkg) {
      return '<button type="button" class="credits-pkg-btn" data-pkg="' + pkg.id + '" ' +
        'style="width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--black);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;color:var(--white);font-family:Tajawal,sans-serif;font-size:14px;">' +
        '<span style="font-weight:700;">' + pkg.label + '</span>' +
        '<span style="color:var(--gold);font-weight:900;">' + pkg.price + '</span>' +
        '</button>';
    }).join('');

    box.innerHTML =
      '<div style="font-size:42px;margin-bottom:16px;">' + (window.icon ? window.icon('palette') : '') + '</div>' +
      '<div style="font-size:22px;font-weight:900;color:var(--gold);margin-bottom:8px;">Buy Designs</div>' +
      '<div style="font-size:13px;color:var(--gray);margin-bottom:20px;line-height:1.6;">' + sub + '</div>' +
      '<div id="creditsPkgList">' + packagesHtml + '</div>' +
      '<div id="creditsModalError" style="color:#e06060;font-size:12px;margin-top:6px;min-height:16px;"></div>' +
      '<button type="button" onclick="document.getElementById(\'creditsModalOverlay\').remove()" ' +
      'style="width:100%;background:transparent;border:1px solid var(--border);color:var(--gray);padding:10px;border-radius:10px;font-size:13px;cursor:pointer;margin-top:8px;font-family:Tajawal,sans-serif;">Close</button>';

    overlay.appendChild(box);
    document.body.appendChild(overlay);

    Array.prototype.forEach.call(box.querySelectorAll('.credits-pkg-btn'), function(btn) {
      btn.onclick = function() { startCheckout(btn.getAttribute('data-pkg')); };
    });
  }

  function startCheckout(packageId) {
    var errorEl = document.getElementById('creditsModalError');

    var buttons = document.querySelectorAll('.credits-pkg-btn');
    Array.prototype.forEach.call(buttons, function(b) { b.disabled = true; b.style.opacity = '0.5'; });

    fetch('/api/create-checkout-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ package: packageId, return_page: 'rearrange.html' })
    })
    .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, status: r.status, data: data }; }); })
    .then(function(result) {
      if (result.status === 401) { window.location.replace('lamsa-auth.html'); return; }
      if (!result.ok || !result.data || !result.data.url) {
        if (errorEl) errorEl.textContent = (result.data && result.data.error) || 'Something went wrong, please try again';
        Array.prototype.forEach.call(buttons, function(b) { b.disabled = false; b.style.opacity = '1'; });
        return;
      }
      window.location.href = result.data.url;
    })
    .catch(function(err) {
      console.error('[checkout] failed:', err);
      if (errorEl) errorEl.textContent = 'Connection error';
      Array.prototype.forEach.call(buttons, function(b) { b.disabled = false; b.style.opacity = '1'; });
    });
  }

  function handleCheckoutRedirect() {
    var params = new URLSearchParams(window.location.search);
    var checkout = params.get('checkout');
    if (!checkout) return;

    if (checkout === 'success') {
      alert('Payment successful! Your balance will update in a few seconds.');
      [500, 2000, 4000].forEach(function(delay) { setTimeout(refreshCreditBalance, delay); });
    }

    params.delete('checkout');
    var newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
    window.history.replaceState({}, '', newUrl);
  }

  window.addEventListener('DOMContentLoaded', function() {
    checkAuth().then(function(user) {
      if (!user) return; // checkAuth() already redirected to login
      refreshCreditBalance();
      handleCheckoutRedirect();
    });
  });

  function generate() {
    if (!state.uploadedFile) return;

    // No email/login check here — the page-load auth guard (checkAuth())
    // already redirects to lamsa-auth.html if there's no valid session, and
    // callGenerate() handles a 401 defensively in case the session expired
    // mid-visit.
    console.log('[auto] Generate clicked, sub-mode =', state.subMode);

    document.getElementById('generateBtn').disabled = true;
    showResultLoading();

    var isRedesign = state.subMode === 'redesign';
    var promptToUse = isRedesign ? FULL_REDESIGN_PROMPT : REARRANGE_PROMPT;
    // Full Redesign needs the model to diverge much more from the source photo
    // than a plain rearrange, so give the prompt more weight (guidance_scale)
    // and allow it to actually move further from the source pixels
    // (strength) — fal.ai defaults strength to 0.1 when omitted, which is
    // far too conservative for a full redesign.
    var guidanceScale = isRedesign ? 7.5 : 3.5;
    var strength = isRedesign ? 1 : 0.6;

    ensurePhotoUploaded(function(url) {
      callGenerate(url, promptToUse, guidanceScale, strength);
    });
  }
</script>
</body>
